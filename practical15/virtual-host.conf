# ==============================================================================
# StudentHub Portal - Apache Virtual Host Configuration
# Place this snippet inside: C:\xampp\apache\conf\extra\httpd-vhosts.conf
# ==============================================================================

<VirtualHost *:80>
    ServerAdmin admin@studenthub.local
    DocumentRoot "C:/xampp/htdocs/studenthub-portal"
    ServerName studenthub.local
    ServerAlias www.studenthub.local

    <Directory "C:/xampp/htdocs/studenthub-portal">
        Options Indexes FollowSymLinks MultiViews
        AllowOverride All
        Require all granted
    </Directory>

    # Access and Error Logging
    ErrorLog "logs/studenthub_error.log"
    CustomLog "logs/studenthub_access.log" combined

    # Security Headers
    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set X-XSS-Protection "1; mode=block"
</VirtualHost>

# ==============================================================================
# Local DNS Mapping (Windows Hosts File)
# Append the following line to: C:\Windows\System32\drivers\etc\hosts
#
# 127.0.0.1    studenthub.local
# 127.0.0.1    www.studenthub.local
# ==============================================================================
