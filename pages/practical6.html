<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Practical 6 - Fetch API</title>
  <link rel="stylesheet" href="../css/script.css">
</head>

<body>
  <h1>Practical 6 - Fetch API, Search & Filter</h1>

  <!-- Navigation -->
  <nav>
    <a href="../index.html">Home</a>
    <a href="login.html">Login</a>
    <a href="registration.html">Registration</a>
    <a href="profile.html">Profile</a>
    <a href="dashboard.html">Dashboard</a>
  </nav>

  <!-- ===== TAB BUTTONS to switch between Events, Students, FAQs ===== -->
  <h2>Choose a Section</h2>
  <div style="padding: 0 25px; margin-bottom: 15px;">
    <button onclick="loadSection('events')">Events</button>
    <button onclick="loadSection('students')">Students</button>
    <button onclick="loadSection('faqs')">FAQs</button>
  </div>

  <!-- ===== SEARCH BAR ===== -->
  <div style="padding: 0 25px; margin-bottom: 10px;">
    <input type="text" id="searchBox" placeholder="Search..." onkeyup="applySearchAndFilter()" style="width: 250px;">
  </div>

  <!-- ===== FILTER DROPDOWN ===== -->
  <div style="padding: 0 25px; margin-bottom: 10px;">
    <label>Filter: </label>
    <select id="filterDropdown" onchange="applySearchAndFilter()">
      <option value="all">All</option>
    </select>

    <!-- ===== SORT DROPDOWN ===== -->
    <label style="margin-left: 15px;">Sort: </label>
    <select id="sortDropdown" onchange="applySearchAndFilter()">
      <option value="default">Default</option>
    </select>
  </div>

  <!-- ===== LOADING MESSAGE ===== -->
  <p id="loadingMsg" style="display: none; color: orange; font-weight: bold;">Loading data...</p>

  <!-- ===== ERROR MESSAGE ===== -->
  <p id="errorMsg" style="display: none; color: red; font-weight: bold;"></p>

  <!-- ===== DATA DISPLAY AREA ===== -->
  <div id="dataContainer" style="padding: 0 25px;"></div>

  <!-- ===== PAGINATION BUTTONS ===== -->
  <div id="paginationContainer" style="padding: 10px 25px;"></div>

  <footer>
    <p>Practical 6 - StudentHub Portal</p>
  </footer>

  <!-- Link to our JavaScript file -->
  <script src="../java/practical6.js"></script>
</body>

</html>
